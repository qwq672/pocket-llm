name: Build PocketLLM APK

# 推送 main 或手动触发时，在 Linux runner 上用 NDK 编译 arm64-v8a release APK，
# 产物作为 workflow artifact 上传（约几分钟到几十分钟，取决于 llama.cpp 首次冷编译）。
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble arm64-v8a Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: 26.1.10909125
      CMAKE_VERSION: 3.22.1
      LLAMA_REF: v0.4.1
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # ubuntu-latest 已预装 cmdline-tools；定位它并加入 PATH
          ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKM" ]; then echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 1; fi
          export PATH="$(dirname "$SDKM"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
                     "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Fetch llama.cpp (pinned ${LLAMA_REF})
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 --branch "${LLAMA_REF}" \
            https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Cache Gradle wrapper and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build release APK (CPU-only arm64-v8a)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Rename and collect APK
        run: |
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" out/pocketllm-${{ env.LLAMA_REF }}-arm64-v8a-release.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketllm-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
