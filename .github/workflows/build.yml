name: Build PocketLLM APK

# 推送 main 或手动触发时，在 Linux runner 上用 NDK 编译 arm64-v8a release APK，
# 产物作为 workflow artifact 上传（约几分钟到几十分钟，取决于 llama.cpp 首次冷编译）。
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble arm64-v8a Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NDK_VERSION: 26.1.10909125
      CMAKE_VERSION: 3.22.1
      LLAMA_REF: v0.4.1
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + Vulkan SDK
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKM" ]; then echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 1; fi
          export PATH="$(dirname "$SDKM"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
                     "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # 装 glslc + Vulkan SDK headers 用于 Vulkan 后端编译
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslc libvulkan-dev 2>/dev/null || \
            sudo apt-get install -y --no-install-recommends glslang-tools libvulkan-dev 2>/dev/null || \
            echo "::warning::glslc/libvulkan-dev not installed, Vulkan backend will fail"
          which glslc || which glslangValidator || true
          ls /usr/include/vulkan/vulkan.hpp || true

      - name: Fetch llama.cpp (pinned ${LLAMA_REF})
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 --branch "${LLAMA_REF}" \
            https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Fetch SPIRV-Headers (for Vulkan backend)
        run: |
          # ggml-vulkan 依赖 SPIRV-Headers 编译 Vulkan shaders。
          # 先 clone + install 到 /usr/local，让 find_package(SPIRV-Headers) 能找到。
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers
          cd /tmp/spirv-headers
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          sudo make install

      - name: Fetch Vulkan-Hpp (C++ bindings, not in NDK)
        run: |
          # NDK 只有 vulkan.h (C API)，ggml-vulkan.cpp 需要 vulkan.hpp (C++ binding)。
          # 需要三个仓库：
          # - Vulkan-Headers: vulkan_core.h, vulkan.h, vulkan_platform.h, vk_video/* 等 C headers
          # - Vulkan-Hpp: vulkan.hpp 等 C++ binding headers
          # - SPIRV-Headers: spirv/ 目录（ggml-vulkan.cpp 还 include <spirv/unified1/spirv.hpp>）
          # 三者复制到 NDK sysroot include，让 NDK clang++ 能找到。
          # Vulkan-Headers 和 Vulkan-Hpp 的 main 分支 VK_HEADER_VERSION 可能差 1-2，
          # 用 sed 把 vulkan.hpp 的版本号同步成 vulkan_core.h 的实际版本。
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers /tmp/vulkan-headers
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Hpp /tmp/vulkan-hpp
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers-2
          NDK_SYSROOT=/usr/local/lib/android/sdk/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
          NDK_VULKAN=$NDK_SYSROOT/vulkan
          NDK_VK_VIDEO=$NDK_SYSROOT/vk_video
          NDK_SPIRV=$NDK_SYSROOT/spirv
          # 备份 NDK 自带的 vulkan_android.h（Android 平台特有）
          sudo cp $NDK_VULKAN/vulkan_android.h /tmp/vulkan_android.h.bak 2>/dev/null || true
          # 覆盖 vulkan/ 目录
          sudo rm -rf $NDK_VULKAN
          sudo mkdir -p $NDK_VULKAN
          sudo cp -r /tmp/vulkan-headers/include/vulkan/* $NDK_VULKAN/
          sudo cp -r /tmp/vulkan-hpp/vulkan/* $NDK_VULKAN/
          # 覆盖 vk_video/ 目录
          sudo rm -rf $NDK_VK_VIDEO
          sudo mkdir -p $NDK_VK_VIDEO
          sudo cp -r /tmp/vulkan-headers/include/vk_video/* $NDK_VK_VIDEO/ 2>/dev/null || true
          # 覆盖 spirv/ 目录（SPIRV-Headers 仓库结构：include/spirv/*）
          sudo rm -rf $NDK_SPIRV
          sudo mkdir -p $NDK_SPIRV/unified1
          sudo cp -r /tmp/spirv-headers-2/include/spirv/* $NDK_SPIRV/unified1/ 2>/dev/null || true
          # 恢复 vulkan_android.h
          if [ ! -f $NDK_VULKAN/vulkan_android.h ] && [ -f /tmp/vulkan_android.h.bak ]; then
            sudo cp /tmp/vulkan_android.h.bak $NDK_VULKAN/vulkan_android.h
          fi
          # 同步 vulkan.hpp 的 VK_HEADER_VERSION 到 vulkan_core.h 的实际版本
          CORE_VER=$(grep -E 'define VK_HEADER_VERSION ' $NDK_VULKAN/vulkan_core.h | awk '{print $3}')
          echo "vulkan_core.h VK_HEADER_VERSION = $CORE_VER"
          sudo sed -i "s/static_assert(VK_HEADER_VERSION == [0-9]*/static_assert(VK_HEADER_VERSION == $CORE_VER/" $NDK_VULKAN/vulkan.hpp
          grep -E 'static_assert.VK_HEADER_VERSION' $NDK_VULKAN/vulkan.hpp | head -1 || true
          ls $NDK_VULKAN/vulkan.hpp
          ls $NDK_VULKAN/vulkan_core.h
          ls $NDK_SPIRV/unified1/spirv.hpp 2>/dev/null || echo "no spirv.hpp"

      - name: Cache Gradle wrapper and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}-v1
          # 注意：app/.cxx 不缓存，因为 CMakeLists.txt 改动需要重新 configure。
          # CMake 编译慢但保证 Vulkan/OpenCL 等后端真的被编译进去。

      - name: Build release APK (CPU + Vulkan + OpenCL, arm64-v8a)
        run: |
          chmod +x ./gradlew
          # CMakeLists.txt 默认启用 Vulkan 和 OpenCL 后端（option(POCKET_VULKAN ... ON)）
          # 不需要再传 cmake arguments。
          # NPU 仍 OFF，需要私有高通 QNN SDK。
          # 没有 GPU 的设备运行时会自动回退到 CPU。
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Rename and collect APK
        run: |
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" out/pocketllm-${{ env.LLAMA_REF }}-arm64-v8a-release.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketllm-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
